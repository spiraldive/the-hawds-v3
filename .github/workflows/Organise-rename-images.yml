name: Organize and Rename Images

on:
  workflow_dispatch:

jobs:
  organize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create folder and rename/move images
        run: |
  
          rm -f images/image-18.png images/image-19.png images/image-20.png

      count=1
for img in images/*.png images/*.jpg images/*.jpeg; do
  if [ -f "$img" ]; then
    extension="${img##*.}"
    mv "$img" "images/image-$count.$extension"
    count=$((count + 1))
  fi
done


      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Move and rename images into images folder"
          branch: main
